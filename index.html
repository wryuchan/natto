<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="納豆を切って、混ぜて、ご飯に盛る短時間の3D調理ゲーム。全20種類の称号を集めよう。">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#f5ead8">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:title" content="納豆調理ゲーム">
    <meta property="og:description" content="納豆を切って、混ぜて、ご飯に盛る短時間の3D調理ゲーム。全20種類の称号を集めよう。">
    <meta property="og:url" content="https://wataryuu.com/natto/">
    <meta property="og:image" content="https://wataryuu.com/natto/assets/images/ogp.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="納豆調理ゲーム">
    <meta name="twitter:description" content="納豆を切って、混ぜて、ご飯に盛る短時間の3D調理ゲーム。全20種類の称号を集めよう。">
    <meta name="twitter:image" content="https://wataryuu.com/natto/assets/images/ogp.jpg">
    <link rel="canonical" href="https://wataryuu.com/natto/">
    <link rel="icon" href="./assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles/app.css">
    <title>納豆調理ゲーム</title>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="app" class="app-shell">
      <header class="app-header">
        <h1 class="app-title">納豆調理ゲーム</h1>
        <div class="app-tools" aria-label="設定">
          <button type="button" data-action="language" aria-label="表示言語を切り替える">English</button>
          <button type="button" data-action="mute" aria-label="効果音のオンとオフを切り替える">音を消す</button>
          <button type="button" data-action="help" aria-label="操作ガイドを開く">遊び方</button>
          <button type="button" data-action="collection">称号一覧</button>
        </div>
      </header>

      <section class="game-stage" data-view="cooking" aria-label="調理画面">
        <canvas id="game-canvas" tabindex="0" aria-label="納豆を調理する3D操作画面"></canvas>
        <p id="app-status" class="sr-only" role="status" aria-live="polite"></p>
        <p class="sr-only" role="alert" aria-live="assertive" data-error-status></p>
        <section id="recovery-overlay" class="recovery-overlay" role="alert" aria-live="assertive" hidden>
          <p data-recovery-message></p>
          <button type="button" data-recovery="retry">再読み込み</button>
        </section>
      </section>

      <nav class="station-nav" data-view="cooking" aria-label="調理ステーション">
        <button type="button" data-station="cut">切る</button>
        <button type="button" data-station="mix">混ぜる</button>
        <button type="button" data-station="serve">盛る</button>
      </nav>
      <label class="onion-amount-control" data-view="cooking">
        <span data-onion-amount-label>ねぎの量</span>
        <input type="range" data-action="onion-amount" min="0.05" max="1" step="0.05" value="0.25">
      </label>
      <button class="finish-button" data-view="cooking" type="button" data-action="finish" aria-label="調理を完成する">完成</button>
      <button class="restart-button" data-view="cooking" type="button" data-action="restart">最初からやり直す</button>

      <section id="result-view" class="view-panel" data-view="result" hidden aria-live="polite"></section>
      <section id="collection-view" class="view-panel" data-view="collection" hidden></section>

      <dialog id="app-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-body">
        <form method="dialog" class="dialog-card">
          <h2 id="dialog-title"></h2>
          <p id="dialog-body"></p>
          <label class="dialog-skip" data-dialog-label="skip-confirmations" hidden>
            <input type="checkbox" data-dialog="skip-confirmations">
          </label>
          <div class="dialog-actions">
            <button type="button" data-dialog="cancel">戻る</button>
            <button type="button" data-dialog="accept">進める</button>
          </div>
        </form>
      </dialog>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
